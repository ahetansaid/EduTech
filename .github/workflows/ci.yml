name: Intégration continue

on:
  push:
    branches: [main, staging, dev, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualite:
    name: Qualité (typage, lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage de tous les paquets
        run: npm run typecheck
      - name: Lint de l'interface
        run: npm run lint --workspace=@beile/web
      - name: Build de production du front
        run: npm run build --workspace=@beile/web
      - name: Build de la fonction API (Vercel Build Output)
        run: npm run build:vercel --workspace=@beile/api
      - name: Audit des dépendances (échec sur vulnérabilité élevée ou critique)
        run: npm audit --audit-level=high
      - name: Cohérence du moteur de simulation
        run: npm run verifier --workspace=@beile/simulation

  recette:
    name: Recette de bout en bout (PostgreSQL + PostGIS jetable)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Base éphémère propre à chaque exécution : aucune donnée de production, aucun secret requis.
    # Mot de passe généré à la volée ; la base n'écoute que sur l'hôte du job.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: ci-postgres-jetable
          POSTGRES_DB: beile
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-postgres-jetable@localhost:5432/beile?sslmode=disable
      DATABASE_URL_UNPOOLED: postgres://postgres:ci-postgres-jetable@localhost:5432/beile?sslmode=disable
      BEILE_ORIGINES_AUTORISEES: http://localhost:3000
      BEILE_FICHIER_COMPTES: ${{ github.workspace }}/comptes-ci.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations et durcissement (ajout seul, RLS, rôle applicatif)
        run: npm run migrer --workspace=@beile/db
      - name: Peuplement (registre, cube national, référentiels)
        run: npm run peupler --workspace=@beile/db
      - name: Rôle de connexion de l'API (beile_api ⊂ beile_app, sans BYPASSRLS)
        run: |
          MDP=$(openssl rand -hex 24)
          echo "::add-mask::$MDP"
          PGPASSWORD=ci-postgres-jetable psql -h localhost -U postgres -d beile -v ON_ERROR_STOP=1             -c "CREATE ROLE beile_api WITH LOGIN NOBYPASSRLS NOCREATEROLE NOCREATEDB PASSWORD '$MDP' IN ROLE beile_app"
          echo "DATABASE_URL_API=postgres://beile_api:$MDP@localhost:5432/beile?sslmode=disable" >> "$GITHUB_ENV"
      - name: Comptes (mots de passe générés, jamais affichés) et projections
        run: |
          npm run comptes --workspace=@beile/db
          npm run projections --workspace=@beile/db
      - name: Vérification de la base (ajout seul, droits, RLS, témoins)
        run: npm run verifier --workspace=@beile/db
      - name: Démarrer l'API
        run: |
          npm run start --workspace=@beile/api > api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:4000/api/v1/sante > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Recette complète, écritures multi-utilisateurs comprises
        run: npm run recette:ecritures --workspace=@beile/api
      - name: Test de charge (100 utilisateurs, 30 s)
        run: npm run charge --workspace=@beile/api -- --utilisateurs 100 --duree 30
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: tail -n 200 api.log
