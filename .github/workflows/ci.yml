name: Intégration continue

on:
  push:
    branches: [main, staging, dev, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualite:
    name: Qualité (typage, lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage de tous les paquets
        run: npm run typecheck
      - name: Lint de l'interface
        run: npm run lint --workspace=@beile/web
      - name: Build de production du front
        run: npm run build --workspace=@beile/web
      - name: Build de la fonction API (Vercel Build Output)
        run: npm run build:vercel --workspace=@beile/api
      - name: Audit des dépendances (échec sur vulnérabilité élevée ou critique)
        run: npm audit --audit-level=high
      - name: Cohérence du moteur de simulation
        run: npm run verifier --workspace=@beile/simulation
      - name: "Moteur d'analyse : familles, déterminisme, refus, suggestions"
        run: npm run verifier:analyse --workspace=@beile/simulation
      - name: Schéma et migrations alignés (aucune table « déclarée seulement »)
        run: |
          npm run generer --workspace=@beile/db
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts déclare des changements sans migration : lancer « npm run generer -w @beile/db » et commiter le SQL."
            git status --porcelain packages/db/drizzle; exit 1
          fi

  recette:
    name: Recette de bout en bout (PostgreSQL + PostGIS jetable)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Base éphémère propre à chaque exécution : aucune donnée de production, aucun secret requis.
    # Mot de passe généré à la volée ; la base n'écoute que sur l'hôte du job.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_PASSWORD: ci-postgres-jetable
          POSTGRES_DB: beile
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-postgres-jetable@localhost:5432/beile?sslmode=disable
      DATABASE_URL_UNPOOLED: postgres://postgres:ci-postgres-jetable@localhost:5432/beile?sslmode=disable
      BEILE_ORIGINES_AUTORISEES: http://localhost:3000
      # Recette derrière un mandataire simulé : le test de charge fournit l'adresse de chaque utilisateur virtuel.
      BEILE_SOURCE_IP: mandataire
      BEILE_MANDATAIRES: "1"
      BEILE_FICHIER_COMPTES: ${{ github.workspace }}/comptes-ci.md
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations et durcissement (ajout seul, RLS, rôle applicatif)
        run: npm run migrer --workspace=@beile/db
      - name: Peuplement (registre, cube national, référentiels)
        run: npm run peupler --workspace=@beile/db
      - name: Référentiel du supérieur (établissements, filières, homologations, étudiants)
        run: npm run superieur --workspace=@beile/db
      - name: Référentiel réel des établissements (annuaire public, sources officielles et OpenStreetMap)
        run: npm run referentiel --workspace=@beile/db
      - name: Rôle de connexion de l'API (beile_api ⊂ beile_app, sans BYPASSRLS)
        run: |
          MDP=$(openssl rand -hex 24)
          echo "::add-mask::$MDP"
          PGPASSWORD=ci-postgres-jetable psql -h localhost -U postgres -d beile -v ON_ERROR_STOP=1             -c "CREATE ROLE beile_api WITH LOGIN NOBYPASSRLS NOCREATEROLE NOCREATEDB PASSWORD '$MDP' IN ROLE beile_app"
          echo "DATABASE_URL_API=postgres://beile_api:$MDP@localhost:5432/beile?sslmode=disable" >> "$GITHUB_ENV"
      - name: Comptes (mots de passe générés, jamais affichés) et projections
        run: |
          npm run comptes --workspace=@beile/db
          npm run organisations --workspace=@beile/db
          npm run projections --workspace=@beile/db
          npm run calendrier --workspace=@beile/db
      - name: Vérification de la base (ajout seul, droits, RLS, témoins)
        run: npm run verifier --workspace=@beile/db
      - name: Clé de sceau éphémère (MAC des diplômes et actes du supérieur)
        run: |
          CLE=$(openssl rand -hex 32)
          echo "::add-mask::$CLE"
          echo "BEILE_CLE_SEAU=$CLE" >> "$GITHUB_ENV"
          # Secrets éphémères des systèmes partenaires (connecteurs signés d'interopérabilité).
          P=""
          for id in educmaster eresultats uac dbau; do S=$(openssl rand -hex 32); echo "::add-mask::$S"; P="${P:+$P,}$id:$S"; done
          echo "BEILE_PARTENAIRES=$P" >> "$GITHUB_ENV"
      - name: Démarrer l'API
        run: |
          npm run start --workspace=@beile/api > api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:4000/api/v1/sante > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Second facteur des comptes de test (TOTP enregistré par l'API, secrets dans COMPTES.local.md)
        run: npm run mfa:comptes-test --workspace=@beile/api
      - name: Année universitaire jouée par l'API (inscriptions, notes, jury, diplômes, guichet)
        run: npm run scenario:superieur --workspace=@beile/api
      - name: "Rejeu du scénario (idempotence : rien ne se double)"
        run: npm run scenario:superieur --workspace=@beile/api
      - name: Couche nationale — EducMaster, eRESULTATS, université, DBAU par connecteurs signés
        run: npm run interop:demo --workspace=@beile/api
      - name: Rejeu des lots partenaires (idempotence)
        run: npm run interop:demo --workspace=@beile/api
      - name: Recette complète, écritures multi-utilisateurs comprises
        run: npm run recette:ecritures --workspace=@beile/api
      - name: Test de charge (100 utilisateurs, 30 s)
        run: npm run charge --workspace=@beile/api -- --utilisateurs 100 --duree 30
      - name: Journal de l'API en cas d'échec
        if: failure()
        run: tail -n 200 api.log
